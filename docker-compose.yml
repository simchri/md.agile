x-build: &dev-image-build
  context: ./
  dockerfile: ./docker/Dockerfile
  args:
    USER: ${USER:?error}
    UID: ${UID:?error}

services:
  # Minimal, non-interactive service used by the Makefile (test/build-release/
  # package/install). It only needs Docker and the source tree: no host
  # dotfiles (.ssh/.gitconfig/.claude/.copilot), no /etc/passwd|shadow|group,
  # no DISPLAY/GPU/privileged access. The image already has a user account
  # matching the host UID (baked in at `docker build` time via `useradd -m -u
  # ${UID}` in docker/Dockerfile), so none of those host-side mounts are
  # needed to run cargo/bats/packaging scripts.
  build-container:
    build: *dev-image-build
    image: mdagile-dev-env
    user: "${UID:?error}:${UID:?error}"
    working_dir: ${PWD:?error}
    environment:
      - USER=${USER}
    ulimits:
      core: -1 # (2)
    deploy:
      resources:
        limits:
          memory: 8gb # (5) Limits container memory usage
    volumes:
       - type: bind
         source: .
         target: ${PWD:?error}
         read_only: false
         bind:
           create_host_path: false

  # Interactive developer shell (used via the `devenv` wrapper), with GPU
  # passthrough, GUI forwarding, host SSH/git identity, sudo-via-host-password,
  # and AI assistant config mounted for convenience. Not used by the Makefile.
  dev-container:
    build: *dev-image-build
    image: mdagile-dev-env
    tty: true # docker run -t
    stdin_open: true # docker run -i
    user: "${UID:?error}:${UID:?error}" # map user id of current user into container ("be yourself" in the container). If this variable is not seen by docker compose, do "export UID" (add to .bashrc, launch clion from a terminal!)
    privileged: true
    network_mode: "host" # (4)
    ipc: "host" # (4)
    pid: "host" # (4)
    group_add:
      - dialout
      - sudo
    working_dir: ${PWD:?error}
    environment:
      - DISPLAY=${DISPLAY:-:0} # (1) set container env-variable DISPLAY to host's value of DISPLAY (forward GUIs to host's display!)
      - NVIDIA_DRIVER_CAPABILITIES=all # (3)
      - USER=${USER}
    ulimits:
      core: -1 # (2)
    deploy:
      resources:
        limits:
          memory: 8gb # (5) Limits container memory usage
        reservations:
          devices:
            - driver: nvidia # (3)
              count: all
              capabilities:
                - gpu
    volumes:

       - /tmp/.X11-unix:/tmp/.X11-unix # (1)

       - type: bind
         source: /etc/passwd
         target: /etc/passwd
         read_only: true

       # allow to "sudo" with normal password
       - type: bind
         source: /etc/shadow
         target: /etc/shadow
         read_only: true

       - type: bind
         source: /etc/group
         target: /etc/group
         read_only: true

       - type: bind
         source: /home/${USER:?error}/.gitconfig
         target: /home/${USER:?error}/.gitconfig
         read_only: false
         bind:
           create_host_path: false

       - type: bind
         source: /home/${USER:?error}/.ssh
         target: /home/${USER:?error}/.ssh
         read_only: false
         bind:
           create_host_path: false

       - type: bind
         source: /home/${USER:?error}/.claude
         target: /home/${USER:?error}/.claude
         read_only: false
         bind:
           create_host_path: false

       - type: bind
         source: /home/${USER:?error}/.copilot
         target: /home/${USER:?error}/.copilot
         read_only: false
         bind:
           create_host_path: false

       - type: bind
         source: .
         target: ${PWD:?error}
         read_only: false
         bind:
           create_host_path: false

  # Interactive developer shell without GPU passthrough (used via `devenv`).
  dev-container-no-gpu:
    build: *dev-image-build
    image: mdagile-dev-env
    tty: true # docker run -t
    stdin_open: true # docker run -i
    user: "${UID:?error}:${UID:?error}" # map user id of current user into container ("be yourself" in the container). If this variable is not seen by docker compose, do "export UID" (add to .bashrc, launch clion from a terminal!)
    privileged: true
    network_mode: "host" # (4)
    ipc: "host" # (4)
    pid: "host" # (4)
    group_add:
      - dialout
      - sudo
    working_dir: ${PWD:?error}
    environment:
      - DISPLAY=${DISPLAY:-:0} # (1) set container env-variable DISPLAY to host's value of DISPLAY (forward GUIs to host's display!)
      - USER=${USER}
    ulimits:
      core: -1 # (2)
    deploy:
      resources:
        limits:
          memory: 8gb # (5) Limits container memory usage
    volumes:

       - /tmp/.X11-unix:/tmp/.X11-unix # (1)

       - type: bind
         source: /etc/passwd
         target: /etc/passwd
         read_only: true

       # allow to "sudo" with normal password
       - type: bind
         source: /etc/shadow
         target: /etc/shadow
         read_only: true

       - type: bind
         source: /etc/group
         target: /etc/group
         read_only: true

       - type: bind
         source: /home/${USER:?error}/.gitconfig
         target: /home/${USER:?error}/.gitconfig
         read_only: false
         bind:
           create_host_path: false

       - type: bind
         source: /home/${USER:?error}/.ssh
         target: /home/${USER:?error}/.ssh
         read_only: false
         bind:
           create_host_path: false

       - type: bind
         source: /home/${USER:?error}/.claude
         target: /home/${USER:?error}/.claude
         read_only: false
         bind:
           create_host_path: false

       - type: bind
         source: /home/${USER:?error}/.copilot
         target: /home/${USER:?error}/.copilot
         read_only: false
         bind:
           create_host_path: false

       - type: bind
         source: .
         target: ${PWD:?error}
         read_only: false
         bind:
           create_host_path: false

# (1) Allow forwarding of GUIs to host display. Allows to execute graphical applications in the container and see the GUI as if run on the host.
# This involves making the X11 server of the host available to the container by mounting the .X11-unix file and setting DISPLAY env variable.
# On the host do: `xhost +local:docker` to allow local unauthorized connections to the xserver for docker, or authenticate with token.
# (2) Enable core dumps. If you need core-dumps, set the core-dump location on the *host* (container inherits this setting from the host).
# (3) use GPU graphics acceleration.
# (4) Enable host network stack, IPC and PID namespace sharing.
# (5) Limit container memory. Will slow-down/freeze/crash processes in container instead of freezing host (e.g. during parallel compilation)
